name: Nightly Fuzzing

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  workflow_dispatch: {}
# Nightly: an overlapping run supersedes the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer (5 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Configure (fuzzing)
        run: |
          CC=clang CXX=clang++ cmake -B build -S . \
            -DLEPTRIS_ENABLE_FUZZING=ON \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF \
            -DLEPTRIS_ENABLE_ICONV=OFF

      - name: Build fuzzers
        run: cmake --build build --target fuzz_parse fuzz_mutate fuzz_xpath fuzz_xslt fuzz_html

      - name: Seed corpus
        run: |
          mkdir -p corpus xpath_corpus
          cp test/fixtures/*.xml corpus/ || true
          printf '%s\n' '//record' '//*[@id="1"]' 'count(//item)' \
            '//a[1]/following-sibling::*' 'sum(//n)' > xpath_corpus/seeds

      - name: Fuzz parser (3 minutes)
        run: |
          ./build/fuzz_parse \
            -max_total_time=180 \
            -max_len=65536 \
            -print_final_stats=1 \
            corpus/

      - name: Fuzz mutation engine (2 minutes)
        run: |
          ./build/fuzz_mutate \
            -max_total_time=120 \
            -max_len=65536 \
            -print_final_stats=1 \
            corpus/

      - name: Fuzz XPath engine (2 minutes)
        run: |
          ./build/fuzz_xpath \
            -max_total_time=120 \
            -max_len=4096 \
            -print_final_stats=1 \
            xpath_corpus/

      - name: Seed the grammar-family corpora
        run: |
          mkdir -p xslt_corpus html_corpus
          cp test/fuzz/corpus/seed* xslt_corpus/ 2>/dev/null || true
          cp test/fuzz/corpus/seed* html_corpus/ 2>/dev/null || true
          cp test/fuzz/corpus/*.bin html_corpus/ 2>/dev/null || true
          # Grammar-aware generation (#2051): deep valid structures —
          # unions, predicates, sorts, arithmetic — composed fresh
          # each run, so libFuzzer anchors at expression depths pure
          # mutation cannot build.
          python3 test/fuzz/generators/gen_xslt_seeds.py \
            xslt_corpus/gen --seed "$GITHUB_RUN_NUMBER" --count 200

      - name: Fuzz XSLT compile (2 minutes)
        run: |
          ./build/fuzz_xslt \
            -max_total_time=120 \
            -max_len=65536 \
            -print_final_stats=1 \
            xslt_corpus/ xslt_corpus/gen/

      - name: Fuzz HTML tokenizer (2 minutes)
        run: |
          ./build/fuzz_html \
            -max_total_time=120 \
            -max_len=65536 \
            -print_final_stats=1 \
            html_corpus/

      - name: Upload crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore
          retention-days: 30
