# Release Validation Workflow
#
# This workflow validates releases by building and testing the release
# tarball on multiple platforms and configurations.

name: Release Validation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (e.g., 0.3.0)'
        required: true
        type: string

jobs:
  validate-release:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: cl
            cxx: cl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Testing version: $VERSION"
        shell: bash

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Set up compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++

      - name: Set up compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          # Ensure Xcode command line tools are installed
          xcode-select --install 2>/dev/null || true

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTAURUS_BUILD_CLI=ON \
            -DTAURUS_BUILD_BENCHMARKS=ON \
            -DBUILD_TESTING=ON \
            -DTAURUS_ENABLE_UTF8PROC=OFF \
            -DTAURUS_ENABLE_ICONV=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Test CLI
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/cli/${{ matrix.build_type }}/taurus.exe version
          else
            ./build/cli/taurus version
          fi
        shell: bash

      - name: Create package
        run: cpack --config build/CPackConfig.cmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taurus-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/taurus-*
            build/*.tar.gz
            build/*.zip
          retention-days: 30

  validate-tarball:
    name: Validate Release Tarball
    runs-on: ubuntu-latest
    needs: validate-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create tarball
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          ./build-aux/make-release.sh "$VERSION"

      - name: Verify tarball
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          ./build-aux/verify-checksum.sh "taurus-${VERSION}.tar.gz"

      - name: Extract and test tarball
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          tar -xzf "taurus-${VERSION}.tar.gz"
          cd "taurus-${VERSION}"

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DTAURUS_BUILD_CLI=ON \
            -DBUILD_TESTING=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: |
            taurus-*.tar.gz
            taurus-*.tar.gz.*
          retention-days: 90

  conformance-tests:
    name: XPath Conformance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure and build
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build build

      - name: Run XPath W3C conformance tests
        run: ctest --test-dir build -R xpath_w3c --output-on-failure

      - name: Display conformance results
        run: |
          echo "XPath W3C Conformance Test Results"
          echo "===================================="
          ctest --test-dir build -R xpath_w3c --verbose | tail -20

  memory-tests:
    name: Memory Leak Tests (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure and build
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON
          cmake --build build

      - name: Run DOM tests with leaks detection
        run: |
          if command -v leaks &> /dev/null; then
            leaks --atExit -- ./build/test/c/test_dom
          else
            echo "leaks command not available, skipping memory test"
            ./build/test/c/test_dom
          fi

      - name: Run XPath tests with leaks detection
        run: |
          if command -v leaks &> /dev/null; then
            leaks --atExit -- ./build/test/c/test_xpath_evaluator
          else
            echo "leaks command not available, skipping memory test"
            ./build/test/c/test_xpath_evaluator
          fi
