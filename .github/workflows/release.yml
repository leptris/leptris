name: Release

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch, or skip.
          - major: Bump major version (0.1.2 → 1.0.0)
          - minor: Bump minor version (0.1.2 → 0.2.0)
          - patch: Bump patch version (0.1.2 → 0.1.3)
          - x.y.z: Specific version (e.g., 0.2.1)
          - skip: Skip version bump, release from current version
        required: true
        default: 'patch'
      create_github_release:
        description: 'Create GitHub release after tagging?'
        required: true
        type: boolean
        default: true
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  validate-and-bump:
    name: Validate and bump version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_branch: ${{ steps.create_branch.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version input
        id: validate
        run: |
          VERSION_INPUT="${{ github.event.inputs.next_version }}"

          if [[ "$VERSION_INPUT" == "skip" ]]; then
            echo "Skipping version bump, using current version"
            echo "skip_bump=true" >> $GITHUB_OUTPUT
          elif [[ "$VERSION_INPUT" =~ ^(major|minor|patch)$ ]]; then
            echo "Valid bump type: $VERSION_INPUT"
            echo "skip_bump=false" >> $GITHUB_OUTPUT
          elif [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Valid specific version: $VERSION_INPUT"
            echo "skip_bump=false" >> $GITHUB_OUTPUT
          else
            echo "::error::Invalid version input: $VERSION_INPUT"
            exit 1
          fi

      - name: Get current version
        if: steps.validate.outputs.skip_bump != 'true'
        id: current_version
        run: |
          # Match project(taurus across multiple lines — the multi-line
          # project() declaration in CMakeLists spreads VERSION over
          # several lines. -A 5 includes them in the grep output.
          CURRENT=$(grep -E -A 5 'project\(\s*taurus' CMakeLists.txt | grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' | head -1 | awk '{print $2}')
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not find version in CMakeLists.txt"
            exit 1
          fi
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Calculate next version
        if: steps.validate.outputs.skip_bump != 'true'
        id: get_version
        run: |
          INPUT="${{ github.event.inputs.next_version }}"
          CURRENT="${{ steps.current_version.outputs.version }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$INPUT" in
            major)
              NEXT="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEXT="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
            *)
              NEXT="$INPUT"
              ;;
          esac

          echo "Next version: $NEXT"
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Create release branch
        id: create_branch
        run: |
          BRANCH="release/v${{ steps.get_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Bump version in CMakeLists.txt
        if: steps.validate.outputs.skip_bump != 'true'
        run: |
          NEW_VERSION="${{ steps.get_version.outputs.version }}"
          # project() is multi-line in CMakeLists; use perl -i -0777 -pe
          # to apply the regex across the whole file (not line-by-line).
          perl -i -0777 -pe "s/(project\(\s*taurus\b[^\)]*?)VERSION\s+[0-9]+\.[0-9]+\.[0-9]+/\${1}VERSION $NEW_VERSION/s" CMakeLists.txt
          sed -i "s/\"version\": \"[0-9]\+\.[0-9]\+\.[0-9]\+\"/\"version\": \"$NEW_VERSION\"/" vcpkg.json
          sed -i "s/\"version-semver\": \"[0-9]\+\.[0-9]\+\.[0-9]\+\"/\"version-semver\": \"$NEW_VERSION\"/" vcpkg.json
          cat CMakeLists.txt | head -10

      - name: Commit version bump
        run: |
          git add CMakeLists.txt vcpkg.json
          git commit -m "release: v${{ steps.get_version.outputs.version }}"

      - name: Push release branch
        run: git push origin "${{ steps.create_branch.outputs.branch }}"

      - name: Create PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "release: v${{ steps.get_version.outputs.version }}" \
            --body "Bump version to v${{ steps.get_version.outputs.version }}." \
            --base main \
            --head "${{ steps.create_branch.outputs.branch }}")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag "v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

      - name: Create GitHub release
        if: github.event.inputs.create_github_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.get_version.outputs.version }}" \
            --title "v${{ steps.get_version.outputs.version }}" \
            --notes "Release v${{ steps.get_version.outputs.version }}" \
            --target "${{ steps.create_branch.outputs.branch }}"
