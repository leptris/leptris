name: Release

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch.
          - major: Bump major version (0.4.2 → 1.0.0)
          - minor: Bump minor version (0.4.2 → 0.5.0)
          - patch: Bump patch version (0.4.2 → 0.4.3)
          - x.y.z: Specific version (e.g., 0.5.0)
        required: true
        default: 'patch'
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Phase 1: Bump version, create release branch, open PR.
  # Triggered by workflow_dispatch.
  # ─────────────────────────────────────────────────────────────────────────
  validate-and-bump:
    name: Bump version and open release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_branch: ${{ steps.create_branch.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version input
        id: validate
        run: |
          INPUT="${{ github.event.inputs.next_version }}"
          if [[ "$INPUT" =~ ^(major|minor|patch|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "skip_bump=false" >> $GITHUB_OUTPUT
            echo "Valid: $INPUT"
          else
            echo "::error::Invalid version input: $INPUT"
            exit 1
          fi

      - name: Run bump-version.sh
        run: |
          chmod +x .github/scripts/bump-version.sh
          echo "y" | .github/scripts/bump-version.sh "${{ github.event.inputs.next_version }}"

      - name: Get new version
        id: get_version
        run: |
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined version: $VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        id: create_branch
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          BRANCH="release/v${VERSION}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git add CMakeLists.txt vcpkg.json CHANGELOG.md bindings/python/pyproject.toml
          git commit -m "release: v${VERSION}"

      - name: Push release branch
        run: git push origin "${{ steps.create_branch.outputs.branch }}"

  create-pr:
    name: Create release PR
    if: github.event_name == 'workflow_dispatch'
    needs: validate-and-bump
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (release branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-and-bump.outputs.release_branch }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ needs.validate-and-bump.outputs.release_branch }}
          VERSION: ${{ needs.validate-and-bump.outputs.version }}
        run: |
          # Draft notes: the version section bump-version.sh generated
          # from conventional commits (same extraction the tag job
          # uses for the GitHub Release body).
          NOTES_FILE="$(mktemp)"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\[" ver "\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          PR_BODY_FILE="$(mktemp)"
          {
            echo "## Release v${VERSION}"
            echo ""
            if [ -s "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
              echo ""
            else
              echo "_No conventional commits since the last tag — write the notes by hand._"
              echo ""
            fi
            echo "### Before merging"
            echo "- [ ] Review and refine the CHANGELOG entry above (drafted from commit subjects)"
            echo "- [ ] Verify all CI checks pass"
            echo "- [ ] Ensure version number is correct"
            echo ""
            echo "### After merging"
            echo "The following happen automatically:"
            echo "- Git tag \`v${VERSION}\` is created"
            echo "- GitHub release is published with notes from CHANGELOG"
            echo "- leptris (py) wheel is built, tested, and published to PyPI"
          } > "$PR_BODY_FILE"

          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "release: v${VERSION}" \
            --body-file "$PR_BODY_FILE" \
            --label release \
            --label automated

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 2: When a release-labeled PR is merged, tag + publish.
  # Triggered by pull_request.closed.
  # ─────────────────────────────────────────────────────────────────────────
  tag-and-release:
    name: Tag and publish GitHub release
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from CMakeLists.txt
        id: get_version
        run: |
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract release notes from CHANGELOG
        id: extract_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          NOTES_FILE="$(mktemp)"

          # Extract the section for this version from CHANGELOG.md.
          # Format: ## [X.Y.Z] - date ...
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\\[" ver "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          # Fallback if no section found
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release v${VERSION}" > "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT
          echo "--- Release notes ---"
          cat "$NOTES_FILE"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push git tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: leptris v${{ steps.get_version.outputs.version }}
          body_path: ${{ steps.extract_notes.outputs.notes_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "::notice::Tag v${VERSION} created"
          echo "::notice::Release: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"

  # ─────────────────────────────────────────────────────────────────────────
  # leptris (py) wheel (PyPI, trusted publisher).
  #
  # The tag push above does NOT fire python-publish.yml's own
  # `push: tags` trigger — tags created with GITHUB_TOKEN never
  # trigger other workflows. Call it here instead.
  # ─────────────────────────────────────────────────────────────────────────
  leptris-py:
    name: Build and publish leptris (py) wheel
    needs: [tag-and-release]
    if: needs.tag-and-release.result == 'success'
    # Reusable workflow in the split-out binding repo
    # (leptris/leptris-py, package "leptris"); the pin lives there
    # in libleptris-version.txt.
    uses: leptris/leptris-py/.github/workflows/release.yml@main
    with:
      publish: true
    permissions:
      id-token: write
      contents: read
