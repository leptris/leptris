name: ASAN + Leak Check

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: AddressSanitizer (Linux)
    runs-on: ubuntu-latest
    # Fail fast on hung runners: the Ubuntu mirrors stall inside
    # apt-get several times a day (observed 3x on 2026-08-18/19,
    # each hanging 1h+ in "Install dependencies" until the 6h job
    # timeout). The slowest healthy run observed is 20.1 minutes
    # (cold cache) — 30 gives it 1.5x headroom while still failing
    # hung installs within half an hour instead of six.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libutf8proc-dev

      - name: Configure (ASAN)
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DTAURUS_BUILD_CLI=ON \
            -DTAURUS_ENABLE_ASAN=ON \
            -DTAURUS_ENABLE_ICONV=OFF \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test under ASAN
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1

  leaks-macos:
    name: leaks (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja utf8proc

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DTAURUS_BUILD_CLI=ON \
            -DTAURUS_ENABLE_UTF8PROC=ON \
            -DTAURUS_ENABLE_ICONV=OFF

      - name: Build
        run: cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Leak check on fixtures
        run: |
          set -e
          for f in basic.xml small.xml; do
            echo "=== $f ==="
            leaks --atExit -- build/cli/taurus parse test/fixtures/$f \
              | tee /tmp/leak_$f.log
            grep -q "0 leaks for 0 total" /tmp/leak_$f.log \
              || { echo "FAIL: leaks on $f"; exit 1; }
          done
