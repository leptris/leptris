name: C Library & CLI Test Suite

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-library:
    name: Test C Library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libutf8proc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja utf8proc

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y
          # utf8proc not strictly required for the core test pass —
          # disable Unicode support to keep the Windows job hermetic.

      - name: Configure (non-Windows)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DTAURUS_BUILD_CLI=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DTAURUS_ENABLE_ICONV=OFF

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        run: |
          # Visual Studio generator picks the MSVC toolchain automatically.
          # utf8proc/iconv disabled — core tests (parse, dom, xpath) don't
          # require Unicode; the goal of this job is to verify the MSVC build.
          cmake -B build -S . `
            -DBUILD_TESTING=ON `
            -DTAURUS_BUILD_CLI=ON `
            -DTAURUS_ENABLE_UTF8PROC=OFF `
            -DTAURUS_ENABLE_ICONV=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --build-config Release

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          # XInclude tests hardcode /tmp/ paths; skip on Windows until
          # they're made portable. The MSVC build itself is the
          # contract this job verifies.
          ctest --test-dir build --output-on-failure --build-config Release `
            --exclude-regex 'XIncludeProcess|XIncludeXpointer|XIncludeRecursion'

      - name: Check for memory leaks (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y valgrind
          valgrind --leak-check=full --error-exitcode=1 --undef-value-errors=no \
            ./build/test/test_smoke
