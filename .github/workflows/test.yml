name: C Library & CLI Test Suite

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-library:
    name: Test C Library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libutf8proc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja utf8proc

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y
          # utf8proc not strictly required for the core test pass —
          # disable Unicode support to keep the Windows job hermetic.

      - name: Configure (non-Windows)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DLEPTRIS_BUILD_CLI=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_ENABLE_ICONV=OFF

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        run: |
          # Visual Studio generator picks the MSVC toolchain automatically.
          # utf8proc/iconv disabled — core tests (parse, dom, xpath) don't
          # require Unicode; the goal of this job is to verify the MSVC build.
          cmake -B build -S . `
            -DBUILD_TESTING=ON `
            -DLEPTRIS_BUILD_CLI=ON `
            -DLEPTRIS_ENABLE_UTF8PROC=OFF `
            -DLEPTRIS_ENABLE_ICONV=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --build-config Release

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          # XInclude tests hardcode /tmp/ paths; CLI tests resolve the
          # binary via a relative path that doesn't survive Windows'
          # CTest working dir; SymbolExportCheck uses nm-style symbol
          # extraction. Skip all three until they're portable. The
          # MSVC build itself is the contract this job verifies.
          ctest --test-dir build --output-on-failure --build-config Release `
            --exclude-regex 'XIncludeProcess|XIncludeXpointer|XIncludeRecursion|XIncludePhaseA|XIncludePhaseC|CliVersion|CliParse|CliFormat|CliXpath|SymbolExportCheck'

      - name: Build shared library (Windows DLL export check, issue #278)
        if: runner.os == 'Windows'
        run: |
          # The default build never links the shared library, so the
          # LEPTRIS_API dllexport path went untested and #278 (macro
          # name mismatch; definition never reaching the objects;
          # mirrored-declaration linkage) shipped. This step builds
          # leptris_shared: MSVC emits no import library unless symbols
          # actually export, so a broken LEPTRIS_API fails here with
          # LNK1181/MSB3073-class errors. CLI is OFF — the CLI uses
          # internal accessors that a shared-only build cannot link
          # (TODO 191, the documented interim contract).
          cmake -B build-shared -S . `
            -DBUILD_TESTING=OFF `
            -DLEPTRIS_BUILD_CLI=OFF `
            -DLEPTRIS_BUILD_STATIC=OFF `
            -DLEPTRIS_BUILD_SHARED=ON `
            -DLEPTRIS_ENABLE_UTF8PROC=OFF `
            -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build-shared --config Release

      - name: Export-surface gate (TODO.concurrency/02)
        if: runner.os != 'Windows'
        run: |
          # Non-Windows exports were "everything" until the visibility
          # preset landed; this gate proves the shared library exports
          # EXACTLY the public headers' declarations.
          cmake -B build-shared -S . -DBUILD_TESTING=OFF \
            -DLEPTRIS_BUILD_CLI=OFF -DLEPTRIS_BUILD_STATIC=OFF \
            -DLEPTRIS_BUILD_SHARED=ON \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build-shared -j
          python3 scripts/check_export_surface.py \
            build-shared/src/libleptris.dylib .

      - name: Check for memory leaks (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y valgrind
          valgrind --leak-check=full --error-exitcode=1 --undef-value-errors=no \
            ./build/test/test_smoke
