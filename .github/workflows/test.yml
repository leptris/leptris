name: C Library & CLI Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-library:
    name: Test C Library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.20.x'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'master'

      - name: Install asciidoctor (for man pages)
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y asciidoctor
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install asciidoctor
          fi
        shell: bash

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE:?Variable not set}

      - name: Build C library
        run: |
          cd build
          make

      - name: Run C unit tests (Google Test)
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Test C examples
        run: |
          cd build
          ./examples/c/basic_example
          ./examples/c/xpath_example
          ./examples/c/namespace_example

      - name: Check for memory leaks (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          cd build
          valgrind --leak-check=full --error-exitcode=1 \
            ./examples/c/basic_example

      - name: Build and run benchmarks
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cd build
          cmake .. -DTAURUS_BUILD_BENCHMARKS=ON
          cmake --build build --target bench_dom_pugixml dom_benchmark
          echo "=== Running Benchmarks ==="
          ./benchmarks/dom_benchmark benchmarks/fixtures/small.xml 1000
          ./benchmarks/bench_dom_pugixml
