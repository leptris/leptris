name: C Library & CLI Test Suite

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-library:
    name: Test C Library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libutf8proc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja utf8proc

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DTAURUS_BUILD_CLI=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DTAURUS_ENABLE_ICONV=OFF

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check for memory leaks (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y valgrind
          valgrind --leak-check=full --error-exitcode=1 --undef-value-errors=no \
            ./build/test/test_smoke
