name: differential

# TODO.SOTA A6 / Gate D3 — binding universality proof.
# One curated corpus through the ruby / python / wasm / rust bindings;
# the four runners' outputs must be byte-identical. See
# test/differential/README.md.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/differential.yml"
      - "test/differential/**"
  pull_request:
    paths:
      - ".github/workflows/differential.yml"
      - "test/differential/**"
  workflow_dispatch:

permissions:
  contents: read

# Gate C3/A6 integration: the pins come from the LATEST RELEASE's
# build-manifest.json (the "bindings" section the release workflow
# records live from the registries) — the gate verifies exactly the
# published set, machine-readably. The FALLBACK_* values exist only
# for releases that predate build-manifest/2; they are the diffpins
# train's last known-good set.
env:
  FALLBACK_ENGINE_TAG: v1.9.432
  FALLBACK_GEM: 1.9.432.0
  FALLBACK_PYPI: 1.9.431.0
  FALLBACK_NPM: 0.1.66
  FALLBACK_RS: 1.9.0

jobs:
  byte-identical:
    name: ruby == python == wasm == rust (byte-for-byte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/differential
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pins from the release manifest (C3)
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # A step may carry only ONE env mapping — these forward the
          # workflow-level FALLBACK_* train into the run script.
          FALLBACK_GEM: ${{ env.FALLBACK_GEM }}
          FALLBACK_PYPI: ${{ env.FALLBACK_PYPI }}
          FALLBACK_NPM: ${{ env.FALLBACK_NPM }}
          FALLBACK_RS: ${{ env.FALLBACK_RS }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          echo "engine_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release: $TAG"
          if gh release download "$TAG" -p build-manifest.json \
              -O /tmp/manifest.json --clobber 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          b = json.load(open("/tmp/manifest.json"))["bindings"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k in ("rubygems", "pypi", "npm", "crates_io"):
                  key = {"rubygems": "gem", "pypi": "pypi",
                         "npm": "npm", "crates_io": "rs"}[k]
                  f.write(f"{key}={b[k]}\n")
          print("pins from manifest:", b)
          PY
          else
            echo "no build-manifest.json on $TAG — falling back to the hardcoded train"
            for kv in "gem=$FALLBACK_GEM" "pypi=$FALLBACK_PYPI" \
                      "npm=$FALLBACK_NPM" "rs=$FALLBACK_RS"; do
              echo "$kv" >> "$GITHUB_OUTPUT"
            done
          fi

      - name: Checkout the pinned engine (the rust leg links it)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pins.outputs.engine_tag }}
          path: engine-src

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the published bindings
        env:
          GEM_PIN: ${{ steps.pins.outputs.gem }}
          PYPI_PIN: ${{ steps.pins.outputs.pypi }}
          NPM_PIN: ${{ steps.pins.outputs.npm }}
          RS_PIN: ${{ steps.pins.outputs.rs }}
        run: |
          set -euo pipefail
          gem install leptris -v "$GEM_PIN"
          pip install "leptris==$PYPI_PIN"
          npm install --no-audit --no-fund "leptris@$NPM_PIN"
          # The rs crate links (not vendors) — pin it to the manifest's
          # version so the leg builds the same train (CI-side rewrite
          # of the runner's Cargo.toml).
          python3 - "$RS_PIN" <<'PY'
          import re, sys
          p = "rs-runner/Cargo.toml"
          s = open(p).read()
          s = re.sub(r'leptris = "=[^"]*"', f'leptris = "={sys.argv[1]}"', s)
          open(p, "w").write(s)
          print("rs-runner pin ->", sys.argv[1])
          PY

      - name: Build the shared engine library (the rust leg links it)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libutf8proc-dev
          cmake -B "$GITHUB_WORKSPACE/engine-src/build" \
                -S "$GITHUB_WORKSPACE/engine-src" \
                -DCMAKE_BUILD_TYPE=Release \
                -DLEPTRIS_BUILD_SHARED=ON \
                -DBUILD_TESTING=OFF \
                -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build "$GITHUB_WORKSPACE/engine-src/build" \
                --target leptris_shared -j 4

      - name: Run the four corpus runners
        env:
          LEPTRIS_LIB_PATH: ${{ github.workspace }}/engine-src/build/src
        run: |
          set -euo pipefail
          ruby run.rb    > /tmp/out.ruby
          python3 run.py > /tmp/out.python
          node run.mjs   > /tmp/out.wasm
          # The rpath keeps the runner finding the lib at run time;
          # LEPTRIS_LIB_PATH tells the crate's build.rs where to link.
          RUSTFLAGS="-C link-arg=-Wl,-rpath,$LEPTRIS_LIB_PATH" \
            cargo run --release --quiet \
            --manifest-path rs-runner/Cargo.toml > /tmp/out.rust

      - name: Diff byte-for-byte
        run: |
          set -euo pipefail
          diff /tmp/out.ruby /tmp/out.python
          diff /tmp/out.ruby /tmp/out.wasm
          diff /tmp/out.ruby /tmp/out.rust
          echo "All four bindings byte-identical:"
          cat /tmp/out.ruby

      - name: Pin the canonical output
        if: failure()
        run: |
          echo "=== ruby ===";   cat /tmp/out.ruby   || true
          echo "=== python ==="; cat /tmp/out.python || true
          echo "=== wasm ===";   cat /tmp/out.wasm   || true
          echo "=== rust ===";   cat /tmp/out.rust   || true
