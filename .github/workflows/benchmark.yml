name: Benchmark

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmarks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libutf8proc-dev libpugixml-dev libxml2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja utf8proc pugixml libxml2

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DTAURUS_BUILD_BENCHMARKS=ON \
            -DTAURUS_ENABLE_ICONV=OFF

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # Run every benchmark binary, capture output, accumulate into one
      # Markdown summary. Uploads the summary + per-binary text as an
      # artifact so PRs can be compared across commits.
      - name: Run benchmarks
        working-directory: benchmarks
        run: |
          set -u
          mkdir -p results
          {
            echo "# Benchmark results — ${{ matrix.os }}"
            echo
            echo "Commit: ${{ github.sha }}"
            echo
          } > results/summary.md

          run_bin() {
            local bin="$1"
            local name
            name=$(basename "$bin")
            if [ -x "$bin" ]; then
              echo "::group::Running $name"
              # Redirect is INSIDE the subshell so it's evaluated relative
              # to build/benchmarks/ (where JSON also lands).
              ( cd ../build/benchmarks && "./$name" > "../../benchmarks/results/${name}.txt" 2>&1 ) || \
                echo "  (failed — see results/${name}.txt)"
              echo "::endgroup::"
              {
                echo "## ${name}"
                echo
                echo '```'
                cat "results/${name}.txt"
                echo '```'
                echo
              } >> results/summary.md
            fi
          }

          for bin in \
              ../build/benchmarks/bench_dom_taurus \
              ../build/benchmarks/bench_dom_libxml2 \
              ../build/benchmarks/bench_xpath_taurus \
              ../build/benchmarks/bench_xpath_libxml2 \
              ../build/benchmarks/bench_xpath_axes_taurus \
              ../build/benchmarks/bench_xpath_axes_libxml2 \
              ../build/benchmarks/bench_xpath_functions_taurus \
              ../build/benchmarks/bench_xpath_functions_libxml2 \
              ../build/benchmarks/bench_sax_taurus \
              ../build/benchmarks/bench_sax_libxml2 \
              ../build/benchmarks/bench_serialize \
              ../build/benchmarks/bench_modify_taurus \
              ../build/benchmarks/benchmark_parse \
              ../build/benchmarks/benchmark_parse_ops \
              ../build/benchmarks/benchmark_first_access \
              ../build/benchmarks/benchmark_memory \
              ../build/benchmarks/dom_benchmark_v2; do
            run_bin "$bin"
          done

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: benchmarks/results/
          if-no-files-found: warn
