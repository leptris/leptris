name: Benchmark

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmarks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libutf8proc-dev libpugixml-dev libxml2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja utf8proc libxml2
          # pugixml is PINNED to 1.14 — the same version the linux legs get
          # via apt libpugixml1v5. brew's `pugixml` formula floats (1.16
          # today) and its numbers moved ~3x between runs, making every
          # macos cross-run comparison apples-to-oranges (#2174). Build the
          # 1.14 tarball into a prefix and point the Configure step's
          # CMAKE_PREFIX_PATH at it; find_package(pugixml) prefers it over
          # the platform search paths, and no brew pugixml exists to drift.
          PUGI_PREFIX="$RUNNER_TEMP/pugixml-1.14"
          if [ ! -f "$PUGI_PREFIX/lib/libpugixml.a" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/pugixml-1.14.tar.gz" \
              https://github.com/zeux/pugixml/releases/download/v1.14/pugixml-1.14.tar.gz
            echo "2f10e276870c64b1db6809050a75e11a897a8d7456c4be5c6b2e35a11168a015  $RUNNER_TEMP/pugixml-1.14.tar.gz" | shasum -a 256 -c -
            tar -xzf "$RUNNER_TEMP/pugixml-1.14.tar.gz" -C "$RUNNER_TEMP"
            cmake -S "$RUNNER_TEMP/pugixml-1.14" -B "$RUNNER_TEMP/pugixml-1.14/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_INSTALL_PREFIX="$PUGI_PREFIX"
            cmake --build "$RUNNER_TEMP/pugixml-1.14/build" -j 3
            cmake --install "$RUNNER_TEMP/pugixml-1.14/build"
          fi
          echo "PUGIXML_1_14_PREFIX=$PUGI_PREFIX" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          # Version echo: makes pugixml drift visible forever (#2174).
          if [ -n "${PUGIXML_1_14_PREFIX:-}" ]; then
            echo "pugixml (pinned, macOS): $(grep -m1 'define PUGIXML_VERSION' "$PUGIXML_1_14_PREFIX/include/pugixml.hpp")"
            PUGI_ARGS="-DCMAKE_PREFIX_PATH=$PUGIXML_1_14_PREFIX"
          else
            dpkg-query -W -f='pugixml (Linux, apt): libpugixml-dev ${Version}\n' libpugixml-dev || true
            PUGI_ARGS=""
          fi
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLEPTRIS_BUILD_BENCHMARKS=ON \
            -DLEPTRIS_ENABLE_LTO=ON \
            -DLEPTRIS_ENABLE_ICONV=OFF \
            $PUGI_ARGS

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # Run every benchmark binary, capture output, accumulate into one
      # Markdown summary. Uploads the summary + per-binary text as an
      # artifact so PRs can be compared across commits.
      - name: Run benchmarks
        working-directory: benchmarks
        run: |
          set -u
          mkdir -p results
          # SSOT paths: every harness runs with CWD=build/benchmarks and
          # reads fixtures/ + writes results/ relative to it. Stage both
          # once here instead of each harness knowing repo-root paths.
          mkdir -p ../build/benchmarks/results
          cp -r fixtures ../build/benchmarks/
          {
            echo "# Benchmark results — ${{ matrix.os }}"
            echo
            echo "Commit: ${{ github.sha }}"
            echo
          } > results/summary.md

          run_bin() {
            local bin="$1"
            local name
            name=$(basename "$bin")
            if [ -x "$bin" ]; then
              echo "::group::Running $name"
              # Redirect is INSIDE the subshell so it's evaluated relative
              # to build/benchmarks/ (where JSON also lands).
              ( cd ../build/benchmarks && "./$name" > "../../benchmarks/results/${name}.txt" 2>&1 ) || \
                echo "  (failed — see results/${name}.txt)"
              echo "::endgroup::"
              {
                echo "## ${name}"
                echo
                echo '```'
                cat "results/${name}.txt"
                echo '```'
                echo
              } >> results/summary.md
            fi
          }

          for bin in \
              ../build/benchmarks/bench_dom_leptris \
              ../build/benchmarks/bench_dom_libxml2 \
              ../build/benchmarks/bench_xpath_leptris \
              ../build/benchmarks/bench_xpath_libxml2 \
              ../build/benchmarks/bench_xpath_axes_leptris \
              ../build/benchmarks/bench_xpath_axes_libxml2 \
              ../build/benchmarks/bench_xpath_functions_leptris \
              ../build/benchmarks/bench_xpath_functions_libxml2 \
              ../build/benchmarks/bench_sax_leptris \
              ../build/benchmarks/bench_sax_libxml2 \
              ../build/benchmarks/bench_serialize \
              ../build/benchmarks/bench_modify_leptris \
              ../build/benchmarks/benchmark_parse \
              ../build/benchmarks/bench_parse_ab \
              ../build/benchmarks/benchmark_parse_ops \
              ../build/benchmarks/benchmark_first_access \
              ../build/benchmarks/benchmark_memory \
              ../build/benchmarks/dom_benchmark_v2 \
              ../build/benchmarks/bench_append_attr_pugixml \
              ../build/benchmarks/bench_pipeline_shapes; do
            run_bin "$bin"
          done

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: benchmarks/results/
          if-no-files-found: warn

  # Dispatch-only: sample the mutation bench on the runner OS and
  # upload the call graph. #2132 phase 2 needs a quiet-machine macos
  # profile before the 44B->32B layout cut — local boxes are under
  # foreign load, so the runner IS the quiet machine.
  profile:
    name: Profile mutation bench (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libutf8proc-dev libpugixml-dev libxml2-dev linux-tools-generic

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja utf8proc libxml2
          # pugixml PINNED to 1.14 — same version the linux legs get via apt
          # libpugixml1v5; brew's formula floats and poisons cross-run
          # comparisons (#2174).
          PUGI_PREFIX="$RUNNER_TEMP/pugixml-1.14"
          if [ ! -f "$PUGI_PREFIX/lib/libpugixml.a" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/pugixml-1.14.tar.gz" \
              https://github.com/zeux/pugixml/releases/download/v1.14/pugixml-1.14.tar.gz
            echo "2f10e276870c64b1db6809050a75e11a897a8d7456c4be5c6b2e35a11168a015  $RUNNER_TEMP/pugixml-1.14.tar.gz" | shasum -a 256 -c -
            tar -xzf "$RUNNER_TEMP/pugixml-1.14.tar.gz" -C "$RUNNER_TEMP"
            cmake -S "$RUNNER_TEMP/pugixml-1.14" -B "$RUNNER_TEMP/pugixml-1.14/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_INSTALL_PREFIX="$PUGI_PREFIX"
            cmake --build "$RUNNER_TEMP/pugixml-1.14/build" -j 3
            cmake --install "$RUNNER_TEMP/pugixml-1.14/build"
          fi
          echo "PUGIXML_1_14_PREFIX=$PUGI_PREFIX" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          # Version echo: makes pugixml drift visible forever (#2174).
          if [ -n "${PUGIXML_1_14_PREFIX:-}" ]; then
            echo "pugixml (pinned, macOS): $(grep -m1 'define PUGIXML_VERSION' "$PUGIXML_1_14_PREFIX/include/pugixml.hpp")"
            PUGI_ARGS="-DCMAKE_PREFIX_PATH=$PUGIXML_1_14_PREFIX"
          else
            dpkg-query -W -f='pugixml (Linux, apt): libpugixml-dev ${Version}\n' libpugixml-dev || true
            PUGI_ARGS=""
          fi
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=ON \
            -DLEPTRIS_ENABLE_LTO=ON \
            -DLEPTRIS_ENABLE_ICONV=OFF \
            $PUGI_ARGS

      - name: Build the bench harness
        run: cmake --build build --target bench_append_attr_pugixml

      - name: Sample (macOS)
        if: runner.os == 'macOS'
        working-directory: build/benchmarks
        run: |
          # sample needs a PID — a ./path argument hits its memgraph
          # parse and errors out with invalid usage.
          ./bench_append_attr_pugixml > bench.stdout.txt 2>&1 &
          PID=$!
          sample $PID 60 -file ../../benchmarks/mutcycle.sample.txt -mayDie || true
          wait $PID || true
          tail -5 bench.stdout.txt

      - name: Profile (Linux)
        if: runner.os == 'Linux'
        working-directory: build/benchmarks
        run: |
          sudo perf record -F 1999 -o ../../benchmarks/perf.data \
            -- ./bench_append_attr_pugixml \
            > bench.stdout.txt 2>&1 || true
          # perf runs under sudo — the data file is root-owned and the
          # artifact upload (and perf report) run as the runner user.
          sudo chown runner:runner ../../benchmarks/perf.data || true
          perf report -i ../../benchmarks/perf.data --stdio \
            > ../../benchmarks/mutcycle.perf.txt 2>/dev/null || true
          tail -5 bench.stdout.txt

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.os }}
          path: |
            benchmarks/mutcycle.sample.txt
            benchmarks/mutcycle.perf.txt
            benchmarks/perf.data
            build/benchmarks/bench.stdout.txt
          if-no-files-found: warn
