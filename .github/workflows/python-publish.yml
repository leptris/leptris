# PyPI release path for pyleptris. Trusted publishing (no stored
# credentials): configure on pypi.org → project settings →
# "Trusted Publisher" → workflow leptris/leptris,
# .github/workflows/python-publish.yml, environment pypi.
# Until that is configured, the artifact built here is installable
# from the run's artifacts via pip.

name: Build and publish pyleptris

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    # Called from release.yml after the release tag is cut. The tag
    # push itself never fires the `push: tags` trigger: tags created
    # with GITHUB_TOKEN do not trigger other workflows.
    inputs:
      publish:
        description: 'Publish the wheel to PyPI (trusted publisher)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'bindings/python/**'
      - '.github/workflows/python-publish.yml'

permissions:
  id-token: write

jobs:
  test:
    name: pyleptris tests (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build libleptris shared library
        shell: bash
        run: |
          cmake -B build-shared -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build-shared --config Release

      - name: Run the test suite
        shell: bash
        working-directory: bindings/python
        run: |
          LIB=$(find "${{ github.workspace }}/build-shared" -type f -o -type l 2>/dev/null | grep -iE '(lib)?leptris\.(dylib|so|dll)$' | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libleptris shared library not found after build"
            exit 1
          fi
          export LEPTRIS_LIB_PATH="$LIB"
          echo "Testing against: $LEPTRIS_LIB_PATH"
          python -m pip install pytest cffi
          python -m pytest tests/ -q

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Run the test suite against the built wheel
        env:
          LEPTRIS_LIB_PATH: ${{ github.workspace }}/build-shared/src/libleptris.so
        run: |
          cmake -B ../../build-shared -S ../.. \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build ../../build-shared
          python -m pip install --force-reinstall dist/*.whl pytest cffi
          python -m pytest tests/ -q

      - uses: actions/upload-artifact@v4
        with:
          name: pyleptris-dist
          path: bindings/python/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_call' && inputs.publish)
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyleptris-dist
          path: dist/

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
