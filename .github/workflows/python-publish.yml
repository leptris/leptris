# PyPI release path for pyleptris. Trusted publishing (no stored
# credentials): configure on pypi.org → project settings →
# "Trusted Publisher" → workflow leptris/leptris,
# .github/workflows/python-publish.yml, environment pypi.
# Until that is configured, the artifact built here is installable
# from the run's artifacts via pip.

name: Build and publish pyleptris

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Run the test suite against the built wheel
        env:
          LEPTRIS_LIB_PATH: ${{ github.workspace }}/build-shared/src/libleptris.so
        run: |
          cmake -B ../../build-shared -S ../.. \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build ../../build-shared
          python -m pip install --force-reinstall dist/*.whl pytest cffi
          python -m pytest tests/ -q

      - uses: actions/upload-artifact@v4
        with:
          name: pyleptris-dist
          path: bindings/python/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyleptris-dist
          path: dist/

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
