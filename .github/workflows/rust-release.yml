# Rust crate publishing (TODO.engine/03). Publishes via crates.io
# TRUSTED PUBLISHING (OIDC): the crate's settings register this repo
# + workflow filename, the job mints an OIDC id-token (id-token:
# write), and rust-lang/crates-io-auth-action exchanges it for a
# short-lived credential (cargo has no native OIDC support).
# Mirrors the leptris-py release pattern: manual dispatch, or call it
# from the C-repo release flow when wanted.
name: Rust release

on:
  workflow_dispatch:
  workflow_call:

# Release: serialize only — never cancel a publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # crates.io trusted publishing: crates-io-auth-action exchanges the
  # OIDC id-token minted by Actions for a short-lived registry
  # credential — no static CARGO_REGISTRY_TOKEN secret exists or is
  # wanted.
  id-token: write

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    # Bound the run: an auth misconfiguration would otherwise idle on
    # cargo's interactive token prompt until the runner default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Build the C core and publish the library location via
      # $GITHUB_ENV. The export MUST live in its own step: GITHUB_ENV
      # changes only apply to SUBSEQUENT steps, and both cargo test
      # and cargo publish (its package-verification build) link
      # against libleptris through build.rs reading LEPTRIS_LIB_PATH.
      # The first dispatch (run 37102814498) failed exactly here —
      # build.rs never saw the variable, fell back to bare -lleptris,
      # and the link failed.
      - name: Build the C shared library
        run: |
          cmake -B build-shared -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build-shared --config Release
          LIB=$(find build-shared -type f -o -type l 2>/dev/null | grep -iE '(lib)?leptris\.(dylib|so|dll)$' | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libleptris shared library not found"
            exit 1
          fi
          echo "LEPTRIS_LIB_PATH=$PWD/$LIB" >> "$GITHUB_ENV"

      - name: Verify the crate builds and links against the C core
        run: cd bindings/rust && cargo test

      # Trusted publishing: cargo has NO native OIDC support (verified:
      # no --trusted-publishing flag on 1.99, run 37104275665; no OIDC
      # code in rust-lang/cargo; zero OIDC strings in the 1.98/1.99/
      # nightly binaries; run 37106363016 failed with "no token found").
      # The official client is rust-lang/crates-io-auth-action (RFC
      # 3691): it exchanges the job's OIDC id-token for a short-lived
      # registry token and exposes it as the `token` output; its post
      # step auto-revokes the token when the job ends. Placed after the
      # build/verify steps to minimize the token's live window.
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        # stdin is closed so any prompt errors immediately instead of
        # idling to the job timeout.
        run: cd bindings/rust && cargo publish < /dev/null
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
