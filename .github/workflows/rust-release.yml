# Rust crate publishing (TODO.engine/03). Publishes via crates.io
# TRUSTED PUBLISHING (OIDC): the crate's settings register this repo
# + workflow filename, the job mints an OIDC id-token (id-token:
# write), and cargo exchanges it for a short-lived credential.
# Mirrors the leptris-py release pattern: manual dispatch, or call it
# from the C-repo release flow when wanted.
name: Rust release

on:
  workflow_dispatch:
  workflow_call:

# Release: serialize only — never cancel a publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # crates.io trusted publishing: the OIDC id-token minted by Actions
  # is exchanged for a short-lived registry credential — no static
  # CARGO_REGISTRY_TOKEN secret exists or is wanted.
  id-token: write

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the crate builds and links against the C core
        run: |
          cmake -B build-shared -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build build-shared --config Release
          LIB=$(find build-shared -type f -o -type l 2>/dev/null | grep -iE '(lib)?leptris\.(dylib|so|dll)$' | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libleptris shared library not found"
            exit 1
          fi
          echo "LEPTRIS_LIB_PATH=$PWD/$LIB" >> "$GITHUB_ENV"
          cd bindings/rust
          cargo test

      - name: Publish to crates.io
        # Trusted publishing (crates.io crate settings -> Trusted
        # Publishing: repo leptris/leptris, workflow rust-release.yml).
        # "always" fails loudly on an OIDC misconfiguration instead of
        # hanging on an interactive token prompt.
        run: cd bindings/rust && cargo publish --trusted-publishing always
