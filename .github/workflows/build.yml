name: CLI Build

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    name: Build CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libutf8proc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja utf8proc

      - name: Configure
        run: cmake -B build -S . -G Ninja -DTAURUS_BUILD_CLI=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DTAURUS_ENABLE_ICONV=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Test CLI - parse
        run: |
          echo '<root><item id="1">Test</item><item id="2">Data</item></root>' > /tmp/test.xml
          ./build/cli/taurus parse /tmp/test.xml
          ./build/cli/taurus xpath --count /tmp/test.xml "count(//item)"
          ./build/cli/taurus format --indent 2 /tmp/test.xml
