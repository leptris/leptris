name: CLI Build

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
      - 'archive/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    name: Build CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libutf8proc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja utf8proc

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Configure (non-Windows)
        if: runner.os != 'Windows'
        run: cmake -B build -S . -G Ninja -DLEPTRIS_BUILD_CLI=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DLEPTRIS_ENABLE_ICONV=OFF

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S . `
            -DLEPTRIS_BUILD_CLI=ON `
            -DBUILD_TESTING=ON `
            -DLEPTRIS_ENABLE_UTF8PROC=OFF `
            -DLEPTRIS_ENABLE_ICONV=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --build-config Release

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          # XInclude tests hardcode /tmp/ paths; CLI tests resolve the
          # binary via a relative path that doesn't survive Windows'
          # CTest working dir; SymbolExportCheck uses nm-style symbol
          # extraction. Skip all three until they're portable. The
          # MSVC build itself is the contract this job verifies.
          ctest --test-dir build --output-on-failure --build-config Release `
            --exclude-regex 'XIncludeProcess|XIncludeXpointer|XIncludeRecursion|XIncludePhaseA|XIncludePhaseC|CliVersion|CliParse|CliFormat|CliXpath|SymbolExportCheck'

      - name: Test CLI - parse
        if: runner.os != 'Windows'
        run: |
          echo '<root><item id="1">Test</item><item id="2">Data</item></root>' > /tmp/test.xml
          ./build/cli/leptris parse /tmp/test.xml
          ./build/cli/leptris xpath --count /tmp/test.xml "count(//item)"
          ./build/cli/leptris format --indent 2 /tmp/test.xml
