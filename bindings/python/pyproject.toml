[build-system]
requires = ["cffi"]
build-backend = "setuptools.build_meta"

[project]
name = "pytaurus"
version = "0.1.0"
description = "Python bindings for libtaurus — fast XML 1.0 parsing and XPath 1.0"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ribose" }]
dependencies = ["cffi"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pytaurus"]
