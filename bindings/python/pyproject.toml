[build-system]
requires = ["setuptools", "cffi"]
build-backend = "setuptools.build_meta"

[project]
name = "pyleptris"
version = "1.1.3"
description = "Python bindings for libleptris — fast XML 1.0 parsing and XPath 1.0"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ribose" }]
dependencies = ["cffi"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pyleptris"]
